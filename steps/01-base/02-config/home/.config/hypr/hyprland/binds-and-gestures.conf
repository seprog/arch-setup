# https://wiki.hypr.land/Configuring/Binds

$mainMod = SUPER

bind = $mainMod       , V      , exec , cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod       , E      , exec , thunar
bind = $mainMod       , SPACE  , exec , $launcher
bind = $mainMod       , RETURN , exec , $terminal

bind = $mainMod       , Q      , killactive ,

bind = $mainMod       , F      , fullscreen , 1
bind = $mainMod SHIFT , F      , fullscreen , 0
bind = $mainMod CTRL  , F      , togglefloating

bind = $mainMod       , P      , pseudo      , # dwindle
bind = $mainMod SHIFT , P      , togglesplit , # dwindle

# Screenshot a region, window, monitor (to clipboard)
bind =                , PRINT , exec , hyprshot -m region --freeze
bind =          CTRL  , PRINT , exec , hyprshot -m window -m active
bind =          SHIFT , PRINT , exec , hyprshot -m output -m active
bind = $mainMod       , PRINT , exec , hyprshot -m region --freeze --clipboard-only
bind = $mainMod CTRL  , PRINT , exec , hyprshot -m window -m active --clipboard-only
bind = $mainMod SHIFT , PRINT , exec , hyprshot -m output -m active --clipboard-only

# Move focus with mainMod + (arrow keys or HLKJ)
bind = $mainMod , LEFT  , movefocus , l
bind = $mainMod , RIGHT , movefocus , r
bind = $mainMod , UP    , movefocus , u
bind = $mainMod , DOWN  , movefocus , d
bind = $mainMod , H     , movefocus , l
bind = $mainMod , L     , movefocus , r
bind = $mainMod , K     , movefocus , u
bind = $mainMod , J     , movefocus , d

# Move window with mainMod + SHIFT + (arrow keys or HLKJ)
bind = $mainMod SHIFT , LEFT  , movewindow , l
bind = $mainMod SHIFT , RIGHT , movewindow , r
bind = $mainMod SHIFT , UP    , movewindow , u
bind = $mainMod SHIFT , DOWN  , movewindow , d
bind = $mainMod SHIFT , H     , movewindow , l
bind = $mainMod SHIFT , L     , movewindow , r
bind = $mainMod SHIFT , K     , movewindow , u
bind = $mainMod SHIFT , J     , movewindow , d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod , 1 , workspace ,  1
bind = $mainMod , 2 , workspace ,  2
bind = $mainMod , 3 , workspace ,  3
bind = $mainMod , 4 , workspace ,  4
bind = $mainMod , 5 , workspace ,  5
bind = $mainMod , 6 , workspace ,  6
bind = $mainMod , 7 , workspace ,  7
bind = $mainMod , 8 , workspace ,  8
bind = $mainMod , 9 , workspace ,  9
bind = $mainMod , 0 , workspace , 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT , 1 , movetoworkspace ,  1
bind = $mainMod SHIFT , 2 , movetoworkspace ,  2
bind = $mainMod SHIFT , 3 , movetoworkspace ,  3
bind = $mainMod SHIFT , 4 , movetoworkspace ,  4
bind = $mainMod SHIFT , 5 , movetoworkspace ,  5
bind = $mainMod SHIFT , 6 , movetoworkspace ,  6
bind = $mainMod SHIFT , 7 , movetoworkspace ,  7
bind = $mainMod SHIFT , 8 , movetoworkspace ,  8
bind = $mainMod SHIFT , 9 , movetoworkspace ,  9
bind = $mainMod SHIFT , 0 , movetoworkspace , 10

# Example special workspace (scratchpad)
bind = $mainMod       , S , togglespecialworkspace , magic
bind = $mainMod SHIFT , S , movetoworkspace        , special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod , mouse_down , workspace , e+1
bind = $mainMod , mouse_up   , workspace , e-1

# Move/resize windows with mainMod + LMB/RMB and dragging or mainMod + R and (SHIFt+) (HLKJ / arrow keys)
bindm = $mainMod , mouse:272 , movewindow
bindm = $mainMod , mouse:273 , resizewindow
bind  = $mainMod , R         , submap , move-resize
submap = move-resize
binde = SHIFT , LEFT   , moveactive   , -50   0
binde = SHIFT , H      , moveactive   , -50   0
binde = SHIFT , RIGHT  , moveactive   ,  50   0
binde = SHIFT , L      , moveactive   ,  50   0
binde = SHIFT , UP     , moveactive   ,   0 -50
binde = SHIFT , K      , moveactive   ,   0 -50
binde = SHIFT , DOWN   , moveactive   ,   0  50
binde = SHIFT , J      , moveactive   ,   0  50
binde =       , LEFT   , resizeactive , -50   0
binde =       , H      , resizeactive , -50   0
binde =       , RIGHT  , resizeactive ,  50   0
binde =       , L      , resizeactive ,  50   0
binde =       , UP     , resizeactive ,   0 -50
binde =       , K      , resizeactive ,   0 -50
binde =       , DOWN   , resizeactive ,   0  50
binde =       , J      , resizeactive ,   0  50
bind  =       , ESCAPE , submap       , reset
submap = reset

# Laptop multimedia, volume, brightness
bindel = CTRL  , XF86MonBrightnessDown , exec , brightnessctl -e4 -n2 set 1%-
bindel = CTRL  , XF86MonBrightnessUp   , exec , brightnessctl -e4 -n2 set 1%+
bindel =       , XF86MonBrightnessDown , exec , brightnessctl -e4 -n2 set 2%-
bindel =       , XF86MonBrightnessUp   , exec , brightnessctl -e4 -n2 set 2%+
bindel = SHIFT , XF86MonBrightnessDown , exec , brightnessctl -e4 -n2 set 5%-
bindel = SHIFT , XF86MonBrightnessUp   , exec , brightnessctl -e4 -n2 set 5%+
bindel = CTRL  , XF86AudioLowerVolume  , exec , wpctl set-volume -l 0 @DEFAULT_AUDIO_SINK@ 1%-
bindel = CTRL  , XF86AudioRaiseVolume  , exec , wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindel =       , XF86AudioLowerVolume  , exec , wpctl set-volume -l 0 @DEFAULT_AUDIO_SINK@ 2%-
bindel =       , XF86AudioRaiseVolume  , exec , wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = SHIFT , XF86AudioLowerVolume  , exec , wpctl set-volume -l 0 @DEFAULT_AUDIO_SINK@ 5%-
bindel = SHIFT , XF86AudioRaiseVolume  , exec , wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl  =       , XF86AudioMute         , exec , wpctl set-mute @DEFAULT_AUDIO_SINK@   toggle
bindl  =       , XF86AudioMicMute      , exec , wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  =       , XF86AudioPlay         , exec , playerctl play
bindl  =       , XF86AudioPause        , exec , playerctl pause
bindl  =       , XF86AudioPrev         , exec , playerctl previous
bindl  =       , XF86AudioNext         , exec , playerctl next


# https://wiki.hypr.land/Configuring/Gestures

gesture = 4 , up         , dispatcher , fullscreen, 0
gesture = 4 , down       , dispatcher , killactive
gesture = 3 , up         , dispatcher , fullscreen, 1
gesture = 3 , down       , dispatcher , exec, $launcher
gesture = 3 , horizontal , workspace