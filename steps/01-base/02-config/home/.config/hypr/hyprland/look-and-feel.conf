# ONLY INITIAL CONF
# THIS FILE WILL BE OVERWRITTEN BY
# ~/.config/wallrust/templates/hyprland.template

general {
  gaps_in = 4
  gaps_out = 12

  border_size = 1
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
  rounding = 6
  rounding_power = 4

  active_opacity = 0.95
  inactive_opacity = 0.8

  shadow {
    enabled = true
    range = 8
    render_power = 4
  }

  blur {
    enabled = true
    size = 2
    passes = 4
    noise = 0
    contrast = 1.2
    vibrancy = 1
  }
}

animations {
  enabled = yes, please :)
}

master {
  new_status = master
}

misc {
  disable_hyprland_logo = true
}
